<textarea
  #notes
  class="h-full w-full resize-none overflow-hidden border-0 outline-0"
  aria-label="session notes"
  i18n-aria-label
  placeholder="insert notes here"
  i18n-placeholder
  [formField]="control"
  (blur)="editMode.set(false)"
></textarea>
@if (!editMode()) {
  <button
    iconEdit
    type="button"
    class="absolute top-1 right-1 bg-white/50 dark:bg-slate-900/50"
    aria-label="edit session notes"
    i18n-aria-label
    (click)="editMode.set(true); notes.focus()"
  ></button>
}
