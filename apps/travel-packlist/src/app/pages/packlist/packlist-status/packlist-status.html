@if (statsVisible() === 'distribution') {
  <div
    class="card"
    [animate.enter]="enterAnimation()"
    [animate.leave]="leaveAnimation()"
  >
    <app-weight-distribution />
  </div>
}
@if (statsVisible() === 'heaviestItems') {
  <div
    class="card flex flex-col items-center"
    [animate.enter]="enterAnimation()"
    [animate.leave]="leaveAnimation()"
  >
    <app-heaviest-items />
  </div>
}
<app-packlist-progress />
