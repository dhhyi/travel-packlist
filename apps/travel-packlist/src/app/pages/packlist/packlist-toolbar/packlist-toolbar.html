@if (display()) {
  <div
    class="flex flex-row flex-wrap items-center justify-center gap-x-3 gap-y-2"
  >
    @if (display()?.hideButtons) {
      <button
        type="button"
        class="link"
        aria-label="Lock answers"
        i18n-aria-label
        [attr.aria-pressed]="isAnswersLockActive()"
        [class.pressed]="isAnswersLockActive()"
        (click)="toggleAnswersLock()"
        (keypress)="toggleAnswersLock()"
      >
        @if (isAnswersLockActive()) {
          <app-icon-lock class="h-5 w-5" />
        } @else {
          <app-icon-lock-open class="h-5 w-5" />
        }
      </button>
      <button
        type="button"
        class="link"
        aria-label="Hide completed items"
        i18n-aria-label
        [attr.aria-pressed]="isHideCompleted()"
        [class.pressed]="isHideCompleted()"
        (click)="toggleHideCompleted()"
        (keypress)="toggleHideCompleted()"
      >
        @if (isHideCompleted()) {
          <app-icon-invisible class="h-5 w-5" />
        } @else {
          <app-icon-visible class="h-5 w-5" />
        }
      </button>
    }
    @if (display()?.weightStatsButtons) {
      <button
        iconPieChart
        iconClass="h-5 w-5"
        type="button"
        class="link"
        aria-label="Display weight distribution"
        i18n-aria-label
        [attr.aria-pressed]="statsVisible() === 'distribution'"
        [class.pressed]="statsVisible() === 'distribution'"
        (click)="toggleStats('distribution')"
      ></button>
      <button
        iconBarChart
        iconClass="h-5 w-5 rotate-90"
        type="button"
        class="link"
        aria-label="Display heaviest items"
        i18n-aria-label
        [attr.aria-pressed]="statsVisible() === 'heaviestItems'"
        [class.pressed]="statsVisible() === 'heaviestItems'"
        (click)="toggleStats('heaviestItems')"
      ></button>
    }
    @if (display()?.notesButton) {
      <button
        iconEditNote
        iconClass="h-5 w-5"
        type="button"
        class="link"
        aria-label="Edit session notes"
        i18n-aria-label
        [attr.aria-pressed]="notesVisible()"
        [class.pressed]="notesVisible()"
        (click)="toggleNotes()"
      ></button>
    }
  </div>
}
